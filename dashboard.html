<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Recall</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
<svg class="recall-mark" width="26" height="26" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M6 26V8H18C21 8 23 10 23 13C23 16 21 18 18 18H6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 18L24 26" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <circle class="mark-dot" cx="27" cy="9" r="2" fill="currentColor"/>
</svg>        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
        </nav>
    </header>

    <div class="dashboard-container">
        <div class="dash-header">
            <div>
                <span class="eyebrow">Meeting history</span>
                <h2>Last meetings</h2>
            </div>
            <a href="index.html" class="new-meet-btn">+ New meeting</a>
        </div>

        <!-- JS will inject cards here -->
        <div id="meetings-container"></div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
